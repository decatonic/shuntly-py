[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shuntly"
version = "0.1.0"
description = "A lightweight, unopinionated wiretap for LLM clients"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "anthropic==0.77.0",
    "openai==2.16.0",
    "ruff==0.15.0",
    "mypy==1.19.1",
    "nox==2025.11.12",
    ]

[tool.setuptools.packages.find]
include = ["shuntly*"]
